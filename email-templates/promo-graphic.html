<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #050505;
    position: relative;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
  }

  /* Diagonal accents */
  .slash {
    position: absolute;
    top: -200px;
    right: 80px;
    width: 250px;
    height: 1400px;
    background: linear-gradient(180deg, #00e5ff 0%, #00e5ff 30%, transparent 100%);
    transform: skewX(-12deg);
    opacity: 0.05;
    z-index: 0;
  }

  .slash-2 {
    position: absolute;
    top: -200px;
    right: 40px;
    width: 3px;
    height: 1400px;
    background: #00e5ff;
    transform: skewX(-12deg);
    opacity: 0.12;
    z-index: 0;
  }

  /* Corner accents */
  .corner-tl {
    position: absolute;
    top: 24px;
    left: 24px;
    width: 36px;
    height: 36px;
    border-top: 2px solid #00e5ff;
    border-left: 2px solid #00e5ff;
    opacity: 0.35;
    z-index: 2;
  }

  .corner-br {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 36px;
    height: 36px;
    border-bottom: 2px solid #00e5ff;
    border-right: 2px solid #00e5ff;
    opacity: 0.35;
    z-index: 2;
  }

  .glow {
    position: absolute;
    top: 30%;
    left: 30%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 60%);
    z-index: 0;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 32px 44px 28px 44px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top section — logo + event */
  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    width: 64px;
    height: 64px;
    border-radius: 14px;
  }

  .logo-text {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #ffffff;
    text-transform: uppercase;
  }

  .event-banner {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    letter-spacing: 1px;
    text-align: center;
  }

  .event-banner strong {
    color: #00e5ff;
  }

  /* Headline */
  .headline-area {
    text-align: center;
  }

  .headline {
    font-size: 130px;
    font-weight: 900;
    line-height: 0.88;
    color: #ffffff;
    letter-spacing: -6px;
  }

  .headline .strike {
    color: rgba(255,255,255,0.15);
    text-decoration: line-through;
    text-decoration-color: rgba(255,68,68,0.5);
    text-decoration-thickness: 5px;
  }

  .headline .accent {
    color: #00e5ff;
  }

  .subline {
    font-size: 22px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    margin-top: 14px;
    line-height: 1.4;
  }

  .subline strong {
    color: #ffffff;
    font-weight: 700;
  }

  .no-bots {
    display: inline-block;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.35);
    letter-spacing: 2px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 100px;
    padding: 6px 20px;
  }

  /* Pricing cards */
  .pricing {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .price-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 22px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .price-card.popular {
    background: rgba(0,229,255,0.06);
    border: 1px solid rgba(0,229,255,0.2);
  }

  .plan-name {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
  }

  .plan-tag {
    font-size: 13px;
    font-weight: 700;
    color: #00e5ff;
    background: rgba(0,229,255,0.12);
    padding: 4px 10px;
    border-radius: 6px;
    margin-left: 12px;
    vertical-align: middle;
  }

  .plan-prices {
    text-align: right;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .old-price {
    font-size: 22px;
    color: rgba(255,255,255,0.2);
    text-decoration: line-through;
    font-weight: 600;
  }

  .new-price {
    font-size: 34px;
    font-weight: 900;
    color: #00e5ff;
  }

  /* Code section */
  .code-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .code-label {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .code-box {
    background: rgba(0,229,255,0.08);
    border: 2px solid rgba(0,229,255,0.3);
    border-radius: 12px;
    padding: 14px 36px;
  }

  .code-value {
    font-size: 36px;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 4px;
  }

  /* Bottom bar */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .deadline {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .deadline-dot {
    width: 8px;
    height: 8px;
    background: #ff4444;
    border-radius: 50%;
  }

  .deadline-text {
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
  }

  .deadline-text strong {
    color: #ff6b6b;
  }

  .url {
    font-size: 14px;
    color: rgba(255,255,255,0.25);
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="slash"></div>
  <div class="slash-2"></div>
  <div class="glow"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <div class="content">
    <!-- Top — Logo + Event -->
    <div class="top-section">
      <div class="logo-area">
        <img src="../public/logo.jpg" class="logo-img" alt="SharpMoney">
        <div class="logo-text">SharpMoney</div>
      </div>
      <div class="event-banner">🏀 <strong>March Madness</strong> &nbsp;+&nbsp; ⚾ <strong>MLB Opening Day</strong></div>
    </div>

    <!-- Headline -->
    <div class="headline-area">
      <div class="headline">
        <span class="strike">FULL PRICE</span><br>
        <span class="accent">HALF OFF.</span>
      </div>
      <div class="subline"><strong>50% off your first month</strong> — any plan.</div>
      <div class="no-bots">No more Discord bots — full web + mobile app</div>
    </div>

    <!-- Pricing -->
    <div class="pricing">
      <div class="price-card">
        <div class="plan-name">Core</div>
        <div class="plan-prices">
          <span class="old-price">$29.99</span>
          <span class="new-price">$14.99</span>
        </div>
      </div>
      <div class="price-card popular">
        <div class="plan-name">Pro <span class="plan-tag">POPULAR</span></div>
        <div class="plan-prices">
          <span class="old-price">$79.99</span>
          <span class="new-price">$39.99</span>
        </div>
      </div>
      <div class="price-card">
        <div class="plan-name">Alpha</div>
        <div class="plan-prices">
          <span class="old-price">$199.99</span>
          <span class="new-price">$99.99</span>
        </div>
      </div>
    </div>

    <!-- Code -->
    <div class="code-section">
      <div class="code-label">Use code</div>
      <div class="code-box">
        <div class="code-value">Madness50</div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom-bar">
      <div class="deadline">
        <div class="deadline-dot"></div>
        <div class="deadline-text">Expires <strong>March 26, 2026</strong></div>
      </div>
      <div class="url">betsharpmoney.com</div>
    </div>
  </div>
</div>
</body>
</html>
